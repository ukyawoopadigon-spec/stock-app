<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပစ္စည်းစာရင်းနှင့် ငွေစာရင်း</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2196F3">
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f6f9; color: #333; }
        h3 { text-align: center; color: #222; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        .btn-add { background: #2196F3; color: white; font-weight: bold; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #e0e0e0; color: #000; font-weight: bold; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        tr:hover { background: #f1f1f1; cursor: pointer; }
        .footer-row { background: #9E9E9E; color: white; font-weight: bold; }
        /* Popup Window Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 85%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-cancel { background: #f44336; color: white; }
    </style>
</head>
<body>

    <h3>ပစ္စည်းအဝင်အထွက်စာရင်း</h3>

    <!-- ဖြည့်စွက်ရန်နေရာ -->
    <div class="input-group">
        <input type="text" id="itemName" placeholder="အမျိုးအမည် (မြန်မာ)">
        <input type="number" id="itemQty" placeholder="အရေအတွက်">
        <input type="number" id="itemPrice" placeholder="ဈေးနှုန်း">
    </div>
    <button class="btn-add" onclick="addItem()">ပစ္စည်းအသစ် စာရင်းသွင်းရန်</button>

    <!-- ဇယားကွက် -->
    <table>
        <thead>
            <tr>
                <th>အမျိုးအမည်</th>
                <th class="text-center">လက်ကျန်</th>
                <th class="text-right">ဈေးနှုန်း</th>
                <th class="text-right">စုစုပေါင်းငွေ</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- ဒေတာများ ဤနေရာတွင် ပေါ်လာမည် -->
        </tbody>
        <tfoot>
            <tr class="footer-row">
                <td colspan="3">စုစုပေါင်းကျသင့်ငွေ</td>
                <td id="grandTotal" class="text-right">0</td>
            </tr>
        </tfoot>
    </table>

    <!-- အတိုးအလျှော့လုပ်မည့် ပေါပ်အပ် (Modal Popup) -->
    <div id="updateModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-title"></div>
            <p style="font-size:13px; color:#666;">တိုးချင်လျှင် ပေါင်းကိန်း (ဥပမာ- 5)၊ လျှော့ချင်လျှင် နှုတ်ကိန်း (ဥပမာ- -5) ရိုက်ထည့်ပါ။</p>
            <input type="number" id="changeQty" placeholder="အတိုး/အလျှော့ အရေအတွက်">
            <div class="modal-buttons">
                <button class="btn-save" onclick="saveUpdate()">ပြင်ဆင်မည်</button>
                <button class="btn-cancel" onclick="closeModal()">မလုပ်တော့ပါ</button>
            </div>
        </div>
    </div>

    <script>
        let stockData = JSON.parse(localStorage.getItem('stockData')) || [];
        let selectedIndex = -1;

        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let grandTotal = 0;

            stockData.forEach((item, index) => {
                let total = item.qty * item.price;
                grandTotal += total;

                let row = `<tr onclick="openModal(${index})">
                    <td>${item.name}</td>
                    <td class="text-center">${item.qty}</td>
                    <td class="text-right">${item.price}</td>
                    <td class="text-right">${total}</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('grandTotal').innerText = grandTotal;
            localStorage.setItem('stockData', JSON.stringify(stockData));
        }

        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const qty = parseInt(document.getElementById('itemQty').value);
            const price = parseInt(document.getElementById('itemPrice').value);

            if (!name || isNaN(qty) || isNaN(price)) {
                alert('အချက်အလက် အားလုံးကို မှန်ကန်စွာ ဖြည့်စွက်ပါ');
                return;
            }

            // အမည်တူရှိမရှိ စစ်ဆေးခြင်း
            if (stockData.some(item => item.name === name)) {
                alert('ဤပစ္စည်းအမည် ရှိနှင့်ပြီးသားဖြစ်ပါသည်');
                return;
            }

            stockData.push({ name, qty, price });
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('itemPrice').value = '';
            updateTable();
        }

        function openModal(index) {
            selectedIndex = index;
            const item = stockData[index];
            document.getElementById('modalTitle').innerText = `${item.name} (လက်ကျန်: ${item.qty})`;
            document.getElementById('changeQty').value = '';
            document.getElementById('updateModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('updateModal').style.display = 'none';
        }

        function saveUpdate() {
            const change = parseInt(document.getElementById('changeQty').value);
            if (isNaN(change)) {
                alert('အရေအတွက် ထည့်သွင်းပါ');
                return;
            }

            let newQty = stockData[selectedIndex].qty + change;
            if (newQty < 0) {
                alert('လက်ကျန်ပစ္စည်း ၀ ထက် မနည်းရပါ');
                return;
            }

            stockData[selectedIndex].qty = newQty;
            closeModal();
            updateTable();
        }

        // စဖွင့်ချင်း ဇယားဆွဲရန်
        updateTable();

        // PWA - Service Worker မှတ်ပုံတင်ခြင်း
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
